<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:14px system-ui,"Microsoft JhengHei",sans-serif;color:#252722}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{flex:1;cursor:pointer;border:1px solid #344638;border-radius:7px;padding:10px 8px;font:inherit;background:#344638;color:white}#zip,#retryZip{background:#fffdfa;color:#344638}button:disabled{opacity:.5;cursor:wait}p,a,label{font-size:12px;line-height:1.5;margin:8px 0 0}label{margin:0;max-width:155px}a{display:block;color:#496a50}.error{color:#a94236}[hidden]{display:none!important}@media(max-width:460px){label{max-width:110px}}</style></head>
<body><div class="actions"><button id="mp4">輸出 H.264 MP4</button><label><input id="zipBackup" type="checkbox" checked>同時下載 ZIP 專案備份</label><button id="zip">下載 ZIP</button></div><p id="status" role="status"></p><a id="mp4Fallback" hidden>備用下載已產生的MP4</a><a id="fallback" hidden>備用下載已產生的ZIP</a><button id="retryZip" hidden>重試此版本 ZIP（保留原輸出快照）</button>
<script src="actions.js"></script></body></html>
